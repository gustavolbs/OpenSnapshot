<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenSnapshot: visual changes</title>
<style>
/* Layout, controls and overlay layers follow the usual hosted visual-review tools. */
:root {
    --text: #2e3338; --muted: #5c6570; --line: rgb(38 74 115 / .15); --blue: #0064d6; --blue-bg: #ebf4ff;
    --track: #eef0f2; --tip: #333; --strong: #454c54; --yellow: rgb(254 210 48); --green-bar: #66bf3c;
    font: 14px/20px "Nunito Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--text);
}
* { box-sizing: border-box; }
body { margin: 0; background: #fff; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
svg { display: block; fill: currentColor; }

header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 88px; padding: 0 20px 0 0; }
.title { font-size: 16px; line-height: 16px; }
.title b { font-weight: 700; }
.meta { display: flex; gap: 16px; align-items: center; margin-top: 7px; font-size: 12px; line-height: 12px; color: var(--muted); }
.meta span { display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.chip { max-width: 118px; }
.chip > :last-child { overflow: hidden; text-overflow: ellipsis; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: #ffae00; }
.chip svg { color: #ffae00; }
.segmented { display: inline-flex; background: var(--track); border-radius: 48px; }
.segmented button { height: 28px; padding: 8px 20px; border-radius: 36px; font-size: 12px; line-height: 12px; font-weight: 800; color: var(--muted); }
.segmented button[aria-pressed="true"] { background: #fff; color: var(--text); box-shadow: inset 0 0 0 1px rgb(38 74 115 / .2); }
.end { display: flex; justify-content: flex-end; align-items: center; gap: 16px; }
.arrows { display: flex; gap: 6px; }
.arrows button { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); box-shadow: inset 0 0 0 1px rgb(38 74 115 / .25); }
.arrows button:disabled { opacity: .4; cursor: default; }
.status { text-align: right; font-size: 14px; }
.status small { display: block; font-size: 12px; line-height: 16px; font-weight: 700; color: var(--blue); }

.panels { display: flex; margin-top: 28px; }
.panel { flex: 1 1 0; min-width: 0; }
.bar { display: flex; align-items: center; gap: 4px; height: 40px; padding: 10px 10px 10px 20px; background: rgb(255 255 255 / .95); white-space: nowrap; }
.bar b { font-weight: 700; }
.bar .ref { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.tools { display: flex; gap: 4px; margin-left: auto; }
.tools button { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 7px; border-radius: 5px; line-height: 14px; color: var(--muted); }
.tools button:hover { background: rgb(38 74 115 / .06); }
.tools button[aria-pressed="true"] { background: var(--blue-bg); color: var(--blue); }
.canvas { height: calc(100vh - 156px); overflow: auto; padding: 2px; border-left: 1px solid transparent; }
.panel + .panel .canvas { border-left-color: var(--line); }
.shot { position: relative; max-width: 100%; }
.shot img { display: block; width: 100%; height: auto; }
.shot .layer { position: absolute; inset: 0; z-index: 1; transition: opacity .2s; }
.layer.changes { opacity: .7; }
.layer.changes.strobe { opacity: 1; animation: strobe .6s ease-in-out infinite; }
.layer.changes.off { opacity: 0; animation: none; }
.layer.focus { opacity: 0; transition: all .2s; }
.layer.focus.on { opacity: .7; }
@keyframes strobe {
    0%, 100% { filter: hue-rotate(0deg) opacity(1); transform: translate3d(0, 0, 0); }
    12.5%, 62.5% { transform: translate3d(-1px, 0, 0); }
    37.5%, 87.5% { transform: translate3d(1px, 0, 0); }
    50% { filter: hue-rotate(180deg) opacity(.7); }
}
@media (prefers-reduced-motion: reduce) {
    .layer.changes.strobe { animation-name: strobe-still; }
    @keyframes strobe-still { 50% { filter: hue-rotate(180deg) opacity(.7); } }
}

[data-tip] { position: relative; }
[data-tip]:hover::after, [data-tip]:focus-visible::after {
    content: attr(data-tip); position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); z-index: 3;
    padding: 4px 6px; border-radius: 4px; background: var(--tip); color: #fff; font-size: 11px; line-height: 12px; font-weight: 700; white-space: nowrap;
}
/* The last tool sits at the right edge; centering its tooltip would push the page wider than the window. */
.tools button:last-child::after { left: auto; right: 0; transform: none; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
.back { display: flex; align-self: stretch; align-items: center; padding: 20px 20px 20px 10px; color: var(--muted); }
.back svg:first-child { width: 10px; }
header > :first-child { display: flex; align-items: center; }

/* Build page: the list of every changed snapshot. */
body.build { background: #f7fafd; }
main { max-width: 1365px; margin: 0 auto; padding: 0 40px 60px; }
.build-head { display: flex; align-items: center; gap: 20px; padding: 44px 0 40px; }
.status-dot { width: 44px; height: 44px; border-radius: 50%; background: var(--yellow); flex: none; }
.status-dot.pass { background: var(--green-bar); }
.build-head h1 { margin: 0; font-size: 28px; line-height: 28px; font-weight: 700; }
.build-head p { margin: 8px 0 0; color: var(--muted); }
.totals { display: flex; margin-left: auto; text-align: center; }
.totals div { padding: 0 15px; }
.totals div + div { border-left: 1px solid var(--line); padding-right: 0; }
.totals b { display: block; font-size: 28px; line-height: 28px; font-weight: 400; color: var(--strong); }
.totals span { color: var(--muted); }
.card { background: #fff; border-radius: 5px; box-shadow: 0 1px 3px rgb(0 0 0 / .05); }
.stats { display: flex; align-items: center; gap: 36px; padding: 28px 30px; }
.stats > div { display: flex; gap: 36px; }
.stats > div + div { border-left: 1px solid var(--line); padding-left: 36px; }
.stat b { display: block; font-size: 14px; line-height: 16px; font-weight: 700; color: var(--strong); }
.stat span { display: block; margin-top: 2px; font-size: 12px; line-height: 16px; color: var(--muted); }
.stat .link { color: #006deb; }
.stat .green { color: rgb(66 124 39); }
.stat .brown { color: rgb(148 91 30); }
.tests-head { display: flex; align-items: center; gap: 20px; margin: 50px 0 14px; color: var(--muted); font-size: 13px; }
.tests-head h2 { margin: 0; font-size: 13px; line-height: 28px; font-weight: 800; letter-spacing: 4.55px; text-transform: uppercase; }
.tests-head span { display: inline-flex; align-items: center; gap: 6px; }
.tests-head .scope { margin-left: auto; }
.tests-head .scope i { width: 6px; height: 6px; border-radius: 50%; background: #ccc; }
.pill { margin-left: auto; height: 28px; padding: 8px 16px; border-radius: 36px; background: rgb(227 229 232); color: var(--text); font-size: 12px; line-height: 12px; font-weight: 800; text-decoration: none; }
.progress { height: 12px; background: rgb(227 243 255); }
.progress i, .mini i { display: block; height: 100%; background: var(--yellow); }
.group-table + .group-table { border-top: 1px solid var(--line); margin-top: 20px; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; color: var(--strong); }
th { height: 52px; padding: 20px 12px 0; vertical-align: top; text-align: left; font-weight: 700; }
th:first-child { padding-left: 30px; }
td { height: 40px; padding: 10px 10.5px; }
td:first-child { padding: 10px 0 10px 46px; }
td:last-child { padding-right: 30px; }
tr.group { background: rgb(248 250 252); }
tr.group td:first-child { padding-left: 10px; }
.group-name { display: flex; align-items: center; gap: 6px; }
.group-name button { display: grid; place-items: center; width: 14px; height: 14px; color: var(--muted); }
.group-name button[aria-expanded="false"] svg { transform: rotate(-90deg); }
.group-name .story { color: #37d5d3; }
.group-name b { font-weight: 700; }
tr.snapshot { cursor: pointer; }
tr.snapshot:hover { background: rgb(38 74 115 / .03); }
tr.snapshot a { display: inline-flex; align-items: center; gap: 8px; color: inherit; text-decoration: none; }
tr.snapshot a svg { color: #ffae00; }
.mini { width: 40px; height: 5px; background: rgb(227 243 255); }
.badge { display: inline-block; padding: 4px 12px; border-radius: 36px; background: rgb(255 249 235); color: rgb(148 91 30); box-shadow: inset 0 0 0 1px rgb(243 212 145); font-size: 12px; line-height: 12px; font-weight: 700; }
.none { padding: 40px; text-align: center; color: var(--muted); }
.none.error { padding: 12px 30px; text-align: left; color: rgb(148 91 30); }
</style>
</head>
<body>
<div id="app"></div>
<script>
const data = /*DATA*/null;
// Icons from @storybook/icons (MIT).
const icon = (d) => `<svg viewBox="0 0 14 14" width="14" height="14" aria-hidden="true"><path fill-rule="evenodd" d="${d}"/></svg>`;
const icons = {
    focus: icon("M0 7a7 7 0 1 1 14 0A7 7 0 0 1 0 7Zm6.5 3.5v2.48A6 6 0 0 1 1.02 7.5H3.5a.5.5 0 0 0 0-1H1.02A6 6 0 0 1 6.5 1.02V3.5a.5.5 0 0 0 1 0V1.02a6 6 0 0 1 5.48 5.48H10.5a.5.5 0 0 0 0 1h2.48a6 6 0 0 1-5.48 5.48V10.5a.5.5 0 0 0-1 0Z"),
    strobe: icon("M2.52 6.6a.57.57 0 0 0-.17.54c.04.2.19.37.38.41l2.78.73-1.5 5c-.06.24.02.5.22.63a.5.5 0 0 0 .28.09.5.5 0 0 0 .35-.14L11.5 7.4c.14-.13.2-.34.15-.54a.53.53 0 0 0-.38-.4l-2.7-.7L10.79.78c.1-.23.04-.5-.15-.66a.5.5 0 0 0-.65 0L2.52 6.6Zm7.72.63-3.07-.8 1.85-4.14-5.2 4.51 2.94.77-1.27 4.28 4.75-4.62Zm-5.73 6.2.04.02Z"),
    diff: icon("M3 3H.5a.5.5 0 0 0-.5.5v10c0 .28.22.5.5.5h10a.5.5 0 0 0 .5-.5V11h2.5a.5.5 0 0 0 .5-.5V.5a.5.5 0 0 0-.5-.5h-10a.5.5 0 0 0-.5.5V3Zm1 1v2.3L6.3 4H4ZM3 4v6.5a.5.5 0 0 0 .5.5H10v2H1V4h2Zm1-1h6.5a.5.5 0 0 1 .5.5V10h2V1H4v2Zm6 7V7.71l-2.3 2.3H10Zm0-3.7V4.7L4.7 10h1.6L10 6.3ZM9.3 4H7.7L4 7.71V9.3L9.3 4Z"),
    switch: icon("M10.646 2.646a.5.5 0 01.708 0l1.5 1.5a.5.5 0 010 .708l-1.5 1.5a.5.5 0 01-.708-.708L11.293 5H1.5a.5.5 0 010-1h9.793l-.647-.646a.5.5 0 010-.708zM3.354 8.354L2.707 9H12.5a.5.5 0 010 1H2.707l.647.646a.5.5 0 01-.708.708l-1.5-1.5a.5.5 0 010-.708l1.5-1.5a.5.5 0 11.708.708z"),
    mode: icon("M8.41 1.59a2 2 0 0 0-2.82 0l-4 4a2 2 0 0 0 0 2.82l4 4a2 2 0 0 0 2.82 0l4-4a2 2 0 0 0 0-2.82l-4-4Zm.71-.71a3 3 0 0 0-4.24 0l-4 4a3 3 0 0 0 0 4.24l4 4a3 3 0 0 0 4.24 0l4-4a3 3 0 0 0 0-4.24l-4-4Z"),
    previous: icon("M9.854 1.646a.5.5 0 010 .708L5.207 7l4.647 4.646a.5.5 0 01-.708.708l-5-5a.5.5 0 010-.708l5-5a.5.5 0 01.708 0z"),
    back: icon("M2.76 7.096a.498.498 0 00.136.258l5.5 5.5a.5.5 0 00.707-.708L3.958 7l5.147-5.146a.5.5 0 10-.708-.708l-5.5 5.5a.5.5 0 00-.137.45z"),
    list: icon("M2.75 2.5a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM5.5 2a.5.5 0 000 1h7a.5.5 0 000-1h-7zM5.5 11a.5.5 0 000 1h7a.5.5 0 000-1h-7zM2 12.25a.75.75 0 100-1.5.75.75 0 000 1.5zM5 7a.5.5 0 01.5-.5h7a.5.5 0 010 1h-7A.5.5 0 015 7zM2 7.75a.75.75 0 100-1.5.75.75 0 000 1.5z"),
    story: icon("M3.5 0h7c.28 0 .5.22.5.5v13a.5.5 0 0 1-.45.5.46.46 0 0 1-.38-.12L7 11.16l-3.17 2.72a.46.46 0 0 1-.38.12.5.5 0 0 1-.45-.5V.5c0-.28.22-.5.5-.5ZM4 12.41l2.66-2.28a.45.45 0 0 1 .38-.13c.1.01.2.05.29.12l2.67 2.3V1H4v11.41Z"),
    expand: icon("M3.854 4.896a.5.5 0 10-.708.708l3.5 3.5a.5.5 0 00.708 0l3.5-3.5a.5.5 0 00-.708-.708L7 8.043 3.854 4.896z"),
    eye: icon("M7 9.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5zM14 7l-.21.293C13.669 7.465 10.739 11.5 7 11.5S.332 7.465.21 7.293L0 7l.21-.293C.331 6.536 3.261 2.5 7 2.5s6.668 4.036 6.79 4.207L14 7zM2.896 5.302A12.725 12.725 0 001.245 7c.296.37.874 1.04 1.65 1.698C4.043 9.67 5.482 10.5 7 10.5c1.518 0 2.958-.83 4.104-1.802A12.72 12.72 0 0012.755 7c-.297-.37-.875-1.04-1.65-1.698C9.957 4.33 8.517 3.5 7 3.5c-1.519 0-2.958.83-4.104 1.802z"),
    next: icon("M4.146 1.646a.5.5 0 01.708 0l5 5a.5.5 0 010 .708l-5 5a.5.5 0 01-.708-.708L8.793 7 4.146 2.354a.5.5 0 010-.708z"),
};

// One entry per changed snapshot (item and mode). New items come first.
const entries = data.items.flatMap((story) => story.snapshots.map((snapshot) => ({ story, snapshot })))
    .sort((a, b) => !!a.snapshot.expected - !!b.snapshot.expected);
// `index` is null on the build page and comes from the URL hash (#1, #2, …) on a snapshot page.
const state = { index: null, up: 2, side: "expected", diff: true, focus: false, strobe: false, collapsed: new Set() };
const app = document.getElementById("app");
const $ = (tag, props = {}, ...children) => {
    const el = Object.assign(document.createElement(tag), props);
    el.append(...children);
    return el;
};
const html = (markup) => { const t = document.createElement("template"); t.innerHTML = markup; return t.content; };
const button = (label, tip, pressed, onclick, ...content) => {
    const el = $("button", { onclick, ariaLabel: label }, ...content);
    el.dataset.tip = tip;
    if (pressed !== undefined) el.setAttribute("aria-pressed", pressed);
    return el;
};
const set = (change) => { Object.assign(state, change); render(); };
const refText = (ref) => `Commit ${ref.sha}${ref.ref ? ` on ${ref.ref}` : ""}`;

// Storybook titles are "Group/Component"; page items are shown whole.
const component = (story) => story.title.startsWith("/") ? story.title : story.title.split("/").pop();

function render() {
    document.body.className = state.index === null ? "build" : "";
    if (state.index === null) return build();
    const { story, snapshot } = entries[state.index];
    const isNew = !snapshot.expected;

    const header = $("header", {},
        $("div", {},
            $("a", { className: "back", href: "#", ariaLabel: "Back to all changes" }, html(icons.back), html(icons.list)),
            $("div", {},
            $("div", { className: "title" }, $("b", { textContent: component(story) }), `:${story.name || story.id}`),
            $("div", { className: "meta" },
                $("span", {}, $("i", { className: "dot" }), refText(data.head)),
                $("span", { className: "chip", ariaLabel: `Mode: ${snapshot.mode}`, title: snapshot.mode }, html(icons.mode),
                    $("span", { textContent: snapshot.mode }))))),
        isNew ? $("div") : $("div", { className: "segmented" },
            button("1 up", "1 up [1]", state.up === 1, () => set({ up: 1 }), "1 up"),
            button("2 up", "2 up [2]", state.up === 2, () => set({ up: 2 }), "2 up")),
        $("div", { className: "end" },
            $("div", { className: "arrows" },
                Object.assign(button("Previous snapshot", "Previous [←]", undefined, () => go(-1), html(icons.previous)), { disabled: state.index === 0 }),
                Object.assign(button("Next snapshot", "Next [→]", undefined, () => go(1), html(icons.next)), { disabled: state.index === entries.length - 1 })),
            $("div", { className: "status", title: `${data.unchanged} unchanged · ${data.skipped} skipped` },
                `${state.index + 1} of ${entries.length} changes`)));

    const panels = isNew ? [panel("actual", snapshot, false)]
        : state.up === 2 ? [panel("expected", snapshot, false, false), panel("actual", snapshot, true)]
        : [panel(state.side, snapshot, true, true)];
    app.replaceChildren(header, $("div", { className: "panels" }, ...panels));
}

function panel(side, snapshot, withTools, withSwitch) {
    const label = side === "expected" ? "Baseline" : "Latest";
    const tools = $("div", { className: "tools" });
    if (withTools && snapshot.changes) {
        if (withSwitch) tools.append(button("Switch snapshots [1]", "Switch snapshots [1]", undefined,
            () => set({ side: state.side === "expected" ? "actual" : "expected" }), html(icons.switch), "Switch"));
        if (state.diff) tools.append(
            button(`${state.focus ? "Disable" : "Enable"} focus mode`, state.focus ? "Disable focus mode" : "Enable focus mode", state.focus, () => set({ focus: !state.focus }), html(icons.focus)),
            button(`${state.strobe ? "Disable" : "Enable"} strobe mode`, state.strobe ? "Disable strobe mode" : "Enable strobe mode", state.strobe, () => set({ strobe: !state.strobe }), html(icons.strobe)));
        tools.append(button(`${state.diff ? "Hide" : "Show"} diff [3]`, `${state.diff ? "Hide" : "Show"} diff [3]`, state.diff, () => set({ diff: !state.diff }), html(icons.diff), "Diff"));
    }
    const shot = $("div", { className: "shot", style: `width:${snapshot.width}px` }, $("img", { src: snapshot[side], alt: label }));
    if (withTools && snapshot.changes) {
        // The layers stay in place and fade out instead of being removed.
        const changes = $("img", { src: snapshot.changes, alt: "", className: `layer changes${!state.diff ? " off" : state.strobe ? " strobe" : ""}` });
        const focus = $("img", { src: snapshot.focus, alt: "", className: `layer focus${state.diff && state.focus ? " on" : ""}` });
        shot.append(changes, focus);
    }
    const ref = side === "expected" ? data.base : data.head;
    return $("section", { className: "panel", ariaLabel: label },
        $("div", { className: "bar" }, $("b", { textContent: label }), $("span", { className: "ref", textContent: refText(ref) }), tools),
        $("div", { className: "canvas", style: `background:${snapshot.background?.[side] ?? "#fff"}` }, shot));
}

function build() {
    const checked = data.unchanged + data.items.length + data.errors.length;
    const stat = (value, label, className = "") => $("div", { className: "stat" }, $("b", { className, textContent: value }), $("span", { textContent: label }));
    const head = $("div", { className: "build-head" },
        $("i", { className: `status-dot${entries.length ? "" : " pass"}` }),
        $("div", {}, $("h1", { textContent: "Visual changes" }), $("p", { textContent: refText(data.head) })),
        $("div", { className: "totals" },
            $("div", {}, $("b", { textContent: data.groups }), $("span", { textContent: data.labels.group })),
            $("div", {}, $("b", { textContent: checked + data.skipped }), $("span", { textContent: data.labels.item }))));
    const info = $("div", { className: "card stats" },
        $("div", {}, stat(checked + data.skipped, `Checked ${data.labels.item.toLowerCase()}`), stat(data.skipped, "Skipped")),
        $("div", {}, stat(data.head.sha, data.head.ref || "Head", "link"), stat(data.base.sha, data.base.ref ? `Merge base with ${data.base.ref}` : "Merge base")));
    const testsHead = $("div", { className: "tests-head" },
        $("h2", { textContent: "Tests" }),
        $("span", {}, html(icons.eye), "Visual"),
        $("span", { className: "scope" }, $("i"), "Changed items only"));
    const summary = $("div", { className: "stats" },
        $("div", {}, stat(checked, "Tests"), stat(entries.length, "Changes"), stat(data.base.sha, "Baseline", "link")),
        $("div", {}, stat(data.unchanged, "Unchanged", "green"), stat(entries.length, "Unreviewed", "brown"), stat(data.errors.length, "Errors", data.errors.length ? "brown" : "")));
    if (entries.length) summary.append($("a", { className: "pill", href: "#1", textContent: "View changes" }));
    const tests = $("div", { className: "card" }, summary,
        $("div", { className: "progress" }, entries.length ? $("i") : ""));
    const newOnes = entries.filter((entry) => !entry.snapshot.expected);
    const changed = entries.filter((entry) => entry.snapshot.expected);
    if (newOnes.length) tests.append(table(`New ${data.labels.item.toLowerCase()}`, newOnes));
    if (changed.length) tests.append(table("Changes", changed));
    for (const error of data.errors) tests.append($("p", { className: "none error", textContent: `${error.id}: ${error.message.split("\n")[0]}` }));
    if (!entries.length && !data.errors.length) tests.append($("p", { className: "none", textContent: `No visual changes: ${data.unchanged} ${data.labels.item.toLowerCase()} match the base build.` }));
    app.replaceChildren($("main", {}, head, info, testsHead, tests));
}

function table(title, list) {
    const body = $("tbody");
    const groups = Map.groupBy(list, (entry) => entry.story);
    for (const [story, items] of groups) {
        const open = !state.collapsed.has(story.id);
        const toggle = $("button", { ariaLabel: `${open ? "Collapse" : "Expand"} ${story.title}`, onclick: () => {
            state.collapsed[open ? "add" : "delete"](story.id);
            render();
        } }, html(icons.expand));
        toggle.setAttribute("aria-expanded", open);
        body.append($("tr", { className: "group" },
            $("td", {}, $("div", { className: "group-name" }, toggle, $("span", { className: "story" }, html(icons.story)),
                $("span", {}, $("b", { textContent: component(story) }), `:${story.name || story.id} (${items.length})`))),
            $("td", {}, $("div", { className: "mini" }, $("i"))), $("td")));
        if (!open) continue;
        for (const entry of items) {
            const href = `#${entries.indexOf(entry) + 1}`;
            body.append($("tr", { className: "snapshot", onclick: () => { location.hash = href; } },
                $("td", {}, $("a", { href }, html(icons.mode), entry.snapshot.mode)),
                $("td", {}, $("span", { className: "badge", textContent: "Unreviewed" })),
                $("td", { textContent: "Visual" })));
        }
    }
    const widths = ["50%", "25%", "25%"];
    return $("div", { className: "group-table" }, $("table", {},
        $("colgroup", {}, ...widths.map((width) => $("col", { style: `width:${width}` }))),
        $("thead", {}, $("tr", {}, ...[title, "Status", "Result"].map((text) => $("th", { textContent: text })))),
        body));
}

function go(step) {
    const index = Math.min(entries.length - 1, Math.max(0, state.index + step));
    if (index !== state.index) location.hash = `#${index + 1}`;
}

function route() {
    const index = Number(location.hash.slice(1)) - 1;
    const next = Number.isInteger(index) && index >= 0 && index < entries.length ? index : null;
    if (next !== state.index) Object.assign(state, { index: next, side: "expected" });
    render();
    scrollTo(0, 0);
}

document.addEventListener("keydown", (event) => {
    if (state.index === null || event.metaKey || event.ctrlKey || event.altKey) return;
    const isNew = !entries[state.index].snapshot.expected;
    if (event.key === "ArrowRight" || event.key === "j") go(1);
    else if (event.key === "ArrowLeft" || event.key === "k") go(-1);
    else if (isNew) return;
    else if (event.key === "1") set(state.up === 2 ? { up: 1 } : { side: state.side === "expected" ? "actual" : "expected" });
    else if (event.key === "2") set({ up: 2 });
    else if (event.key === "3") set({ diff: !state.diff });
});

addEventListener("hashchange", route);
route();
</script>
</body>
</html>
