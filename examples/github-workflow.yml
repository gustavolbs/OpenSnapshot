# Copy to .github/workflows/visual-diff.yml in your repository.
name: Visual diff

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write # only needed when `comment: true`

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the merge base with the target branch needs the history
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: gustavolbs/OpenSnapshot@main # pin a commit SHA in real use
        with:
          working-directory: . # the folder with opensnapshot.config.ts
          comment: false # set to true to post the summary on the pull request
